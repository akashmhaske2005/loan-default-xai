<!DOCTYPE html>
<html>
<head>
    <title>Global Feature Importance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        .bar-container {
            margin: 12px 0;
        }

        .bar-label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .progress-container {
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
            height: 20px;
        }

        .progress-bar {
            height: 100%;
            background: #2c3e50;
            border-radius: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 14px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #1a242f;
        }

        /* DARK MODE */
        .dark {
            background: #1e1e1e;
            color: white;
        }

        .dark .card {
            background: #2c2c2c;
            color: white;
        }

        .dark .progress-container {
            background: #555;
        }

        .dark .progress-bar {
            background: #3498db;
        }
    </style>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark");
        }
    </script>
</head>

<body>

<div class="container">
    <div class="card">
        <h2>Global Feature Importance</h2>

        {% for feature, value in feature_importances %}
        <div class="bar-container">
            <div class="bar-label">
                {{ feature }} ({{ value }})
            </div>
            <div class="progress-container">
                <div class="progress-bar" 
                     style="width: {{ value * 100 }}%;">
                </div>
            </div>
        </div>
        {% endfor %}

        <a href="/" class="back-btn">⬅ Back to Home</a>
    </div>
</div>

</body>
</html>
