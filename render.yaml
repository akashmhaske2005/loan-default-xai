services:
  # ─── Backend (Flask API) ──────────────────────────────────────────────────
  - type: web
    name: loanxai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 app.app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: loanxai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: SESSION_EXPIRY_HOURS
        value: "24"
      - key: APP_URL
        value: https://loanxai.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: LoanXAI

  # ─── Frontend (React/Vite static site) ───────────────────────────────────
  - type: web
    name: loanxai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://loanxai-backend.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html

# ─── PostgreSQL database ───────────────────────────────────────────────────
databases:
  - name: loanxai-db
    databaseName: loanxai
    user: loanxai_user
    plan: free
